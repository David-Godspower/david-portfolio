<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="refresh" content="5;url=index.html"> 
  <title>Message Sent | David Godspower Ajala</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <link rel="icon" type="image/png" href="img/download.png" />
  <style>
    :root {
      --bg: #05070a;
      --card-bg: rgba(17, 24, 39, 0.6);
      --border: rgba(255, 255, 255, 0.08);
      --accent: #00f2ff;
      --accent-glow: rgba(0, 242, 255, 0.15);
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --font-main: 'Inter', system-ui, -apple-system, sans-serif;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: var(--font-main);
      background-color: var(--bg);
      color: var(--text-main);
      height: 100vh;
      cursor: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="%23050505" stroke="%2300F5FF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3l7 14 2-5 5-2-14-7z"/></svg>') 0 0, auto !important;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    body::before {
      content: "";
      position: fixed;
      width: 60vw;
      height: 60vw;
      background: radial-gradient(circle, rgba(0, 242, 255, 0.06), transparent 70%);
      top: -10%;
      right: -10%;
      z-index: -1;
    }
    .btn-home{
       cursor: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="%2300F5FF" stroke="%2300F5FF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3l7 14 2-5 5-2-14-7z"/></svg>') 0 0, pointer !important;
    }

    .thankyou-container {
      background: var(--card-bg);
      backdrop-filter: blur(16px) saturate(180%);
      padding: 60px 40px;
      border-radius: 32px;
      border: 1px solid var(--border);
      text-align: center;
      max-width: 500px;
      width: 90%;
      box-shadow: 0 40px 80px rgba(0, 0, 0, 0.5);
      animation: reveal 0.8s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .icon-box {
      width: 80px;
      height: 80px;
      background: var(--accent-glow);
      border: 1px solid var(--accent);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 30px;
      color: var(--accent);
      font-size: 2rem;
      box-shadow: 0 0 20px var(--accent-glow);
    }

    h1 {
      font-size: 2.5rem;
      font-weight: 800;
      margin-bottom: 15px;
      background: linear-gradient(135deg, #fff 30%, var(--accent) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    p {
      color: var(--text-muted);
      font-size: 1.1rem;
      line-height: 1.6;
      margin: 10px 0;
    }

    .btn-home {
      display: inline-block;
      margin-top: 35px;
      padding: 14px 32px;
      background: var(--accent);
      color: #000;
      text-decoration: none;
      font-weight: 700;
      border-radius: 12px;
      transition: all 0.4s ease;
      box-shadow: 0 10px 20px var(--accent-glow);
    }

    .btn-home:hover {
      transform: translateY(-3px);
      box-shadow: 0 15px 30px var(--accent-glow);
    }

    .redirect-text {
      margin-top: 25px;
      font-size: 0.85rem !important;
      opacity: 0.6;
    }

    @keyframes reveal {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <div class="thankyou-container">
    <div class="icon-box">
      <i class="fas fa-check"></i>
    </div>
    <h1>Message Sent!</h1>
    <p>Thank you for reaching out, David Godspower Ajala will review your message shortly.</p>
    <p>I’ll get back to you as soon as possible.</p>
    
    <a href="index.html" class="btn-home">← Back to Portfolio</a>
    
    <p class="redirect-text">Redirecting you to home in 5 seconds...</p>
  </div>

</body>
</html>
